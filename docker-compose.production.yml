version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [pleros-net]
    environment:
      POSTGRES_USER: pleros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pleros
    volumes:
      - pleros-pg-data:/var/lib/postgresql/data
      - ./infra/sql/init-databases.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pleros -d pleros"]
      interval: 5s
      timeout: 5s
      retries: 15
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [pleros-net]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [pleros-redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    restart: unless-stopped
    networks: [pleros-net]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the Vite SPA at image build time (set in .env.production)
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-/api/v1}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        VITE_WEB_ADMIN_ORIGIN: ${VITE_WEB_ADMIN_ORIGIN:-}
    env_file: [.env.production]
    environment:
      PORT: "4000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_GATEWAY_URL: /api/v1
      AUTH_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_auth
      TENANT_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_tenant
      INVENTORY_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_inventory
      ORDER_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_order
      CRM_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_crm
      STOREFRONT_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_storefront
      PURCHASING_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_purchasing
      PAYMENT_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_payment
      WMS_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_wms
      DISPATCH_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_dispatch
      COMPLIANCE_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_compliance
      LEDGER_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_ledger
      NOTIFICATION_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_notification
      ANALYTICS_DATABASE_URL: postgresql://pleros:${POSTGRES_PASSWORD}@postgres:5432/pleros_analytics
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  pleros-net:
    driver: bridge

volumes:
  pleros-pg-data:
  pleros-redis-data:
