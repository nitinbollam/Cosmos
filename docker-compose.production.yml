version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [cosmos-net]
    environment:
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cosmos
    volumes:
      - cosmos-pg-data:/var/lib/postgresql/data
      - ./infra/sql/init-databases.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos -d cosmos"]
      interval: 5s
      timeout: 5s
      retries: 15
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [cosmos-net]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [cosmos-redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    restart: unless-stopped
    networks: [cosmos-net]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: [.env.production]
    environment:
      PORT: "4000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_GATEWAY_URL: /api/v1
      AUTH_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_auth
      TENANT_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_tenant
      INVENTORY_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_inventory
      ORDER_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_order
      CRM_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_crm
      STOREFRONT_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_storefront
      PURCHASING_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_purchasing
      PAYMENT_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_payment
      WMS_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_wms
      DISPATCH_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_dispatch
      COMPLIANCE_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_compliance
      LEDGER_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_ledger
      NOTIFICATION_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_notification
      ANALYTICS_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD}@postgres:5432/cosmos_analytics
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  cosmos-net:
    driver: bridge

volumes:
  cosmos-pg-data:
  cosmos-redis-data:
