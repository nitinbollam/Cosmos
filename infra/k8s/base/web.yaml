apiVersion: apps/v1
kind: Deployment
metadata:
  name: pleros-web
  labels:
    app: pleros-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pleros-web
  template:
    metadata:
      labels:
        app: pleros-web
    spec:
      containers:
        - name: web
          image: pleros/web:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: pleros-config
            - secretRef:
                name: pleros-secrets
          env:
            - name: PORT
              value: "4000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_GATEWAY_URL
              value: "/api/v1"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pleros-web
spec:
  selector:
    app: pleros-web
  ports:
    - port: 80
      targetPort: 4000
