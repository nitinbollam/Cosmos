# Example ExternalSecret (External Secrets Operator): shared Redis URL for BullMQ / EventBusClient.
# Mount **`cosmos-redis-url`** as env **`REDIS_URL`** on services that publish or subscribe (e.g. order-service,
# notification-service, wms-service). Adjust **`remoteRef`** to your AWS Secrets Manager (or other backend) path.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cosmos-redis
  namespace: cosmos
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: cosmos-redis-url
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_URL: "{{ .url }}"
  data:
    - secretKey: url
      remoteRef:
        key: cosmos/shared
        property: redis_url
