# Example ExternalSecret template (External Secrets Operator): sync tenant DB URLs into storefront-service.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: storefront-database
  namespace: pleros
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: storefront-service-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        STORE_FRONT_DATABASE_URL: "{{ .url }}"
        DATABASE_URL: "{{ .url }}"
  data:
    - secretKey: url
      remoteRef:
        key: storefront/tenant-database
        property: url
