# Optional — Redis, MinIO, OTEL for scaled deployments. Dev uses local Postgres only (`npm run db:setup`).
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pleros
      POSTGRES_PASSWORD: pleros
      POSTGRES_DB: pleros
    ports:
      - "15432:5432"
    volumes:
      - pleros-pg-data:/var/lib/postgresql/data
      - ./infra/sql/init-databases.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pleros -d pleros"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - pleros-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pleros
      MINIO_ROOT_PASSWORD: pleros-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pleros-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/docker/otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  pleros-pg-data:
  pleros-redis-data:
  pleros-minio-data:
