name: Cosmos CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Build & Test (Node services + apps + packages)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cosmos
          POSTGRES_PASSWORD: cosmos
          POSTGRES_DB: cosmos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Preflight (lint · test · build)
        env:
          DATABASE_URL: postgresql://cosmos:cosmos@localhost:5432/cosmos_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-please-rotate-256bit
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-please-rotate
        run: pnpm prod:preflight

  python:
    name: Build & Test (Python AI services)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [cosmos-llm, demand-forecasting, ocr-engine, cashflow-model, anomaly-detection]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        working-directory: ai/${{ matrix.service }}
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          fi
      - name: Lint
        working-directory: ai/${{ matrix.service }}
        run: |
          pip install ruff
          ruff check src/ || true
      - name: Test
        working-directory: ai/${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest tests/
          fi

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [node, python]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build node-service base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node-service.Dockerfile
          push: false
          tags: cosmos/node-service:ci
      - name: Build python-service base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/python-service.Dockerfile
          push: false
          tags: cosmos/python-service:ci
