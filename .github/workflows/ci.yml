name: Pleros CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Build & test (@pleros/web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pleros
          POSTGRES_PASSWORD: pleros
          POSTGRES_DB: pleros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Preflight (lint · test · build)
        env:
          DATABASE_URL: postgresql://pleros:pleros@localhost:5432/pleros_test
          JWT_SECRET: ci-test-jwt-secret-please-rotate-256bit
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-please-rotate
        run: npm run prod:preflight

  docker:
    name: Build @pleros/web image
    runs-on: ubuntu-latest
    needs: [node]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build apps/web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: pleros/web:ci
