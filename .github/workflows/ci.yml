name: Pleros CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Build & test (@pleros/web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pleros
          POSTGRES_PASSWORD: pleros
          POSTGRES_DB: pleros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Create databases and apply schemas (Postgres, like production)
        # One logical database per domain (infra/sql/init-databases.sql), then generate the clients and push every schema.
        env:
          PGPASSWORD: pleros
          PLEROS_DB_PROVIDER: postgres
          DATABASE_URL: postgresql://pleros:pleros@localhost:5432/postgres
        run: |
          psql -h localhost -U pleros -d postgres -v ON_ERROR_STOP=1 -f infra/sql/init-databases.sql
          node scripts/prepare-dev-env.mjs
          npm run build -w @pleros/types
          npm run build -w @pleros/analytics-engine
          node scripts/generate-all-prisma.mjs
          npx tsx scripts/migrate-all.ts
      - name: Preflight (lint · test · build)
        env:
          PLEROS_DB_PROVIDER: postgres
          DATABASE_URL: postgresql://pleros:pleros@localhost:5432/postgres
          JWT_SECRET: ci-test-jwt-secret-please-rotate-256bit
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-please-rotate
        run: npm run prod:preflight

  e2e:
    name: Marketplace E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build workspace libraries
        # The API server imports @pleros/analytics-engine and @pleros/types from their built dist/.
        run: |
          npm run build -w @pleros/types
          npm run build -w @pleros/analytics-engine
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run marketplace E2E
        env:
          JWT_SECRET: ci-test-jwt-secret-please-rotate-256bit
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-please-rotate
        run: npm run test:e2e

  docker:
    name: Build @pleros/web image
    runs-on: ubuntu-latest
    needs: [node]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build apps/web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: pleros/web:ci
          build-args: |
            VITE_GATEWAY_URL=/api/v1
            VITE_STRIPE_PUBLISHABLE_KEY=pk_test_ci_placeholder
            VITE_WEB_ADMIN_ORIGIN=
