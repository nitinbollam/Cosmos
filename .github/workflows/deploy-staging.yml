name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  EKS_CLUSTER: pleros-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push @pleros/web
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -f apps/web/Dockerfile \
            --build-arg VITE_GATEWAY_URL="${VITE_GATEWAY_URL:-/api/v1}" \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY="${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg VITE_WEB_ADMIN_ORIGIN="${{ secrets.VITE_WEB_ADMIN_ORIGIN }}" \
            -t "$ECR_REGISTRY/pleros-web:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/pleros-web:$IMAGE_TAG"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Deploy
        run: |
          IMAGE_TAG=${{ github.sha }}
          cd infra/k8s/overlays/staging
          kubectl apply -k . --record
          kubectl set image deployment/pleros-web web="$ECR_REGISTRY/pleros-web:$IMAGE_TAG" -n pleros
          kubectl rollout status deployment/pleros-web -n pleros --timeout=10m
