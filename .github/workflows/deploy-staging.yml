name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  EKS_CLUSTER: cosmos-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push @cosmos/web
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -f apps/web/Dockerfile -t "$ECR_REGISTRY/cosmos-web:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/cosmos-web:$IMAGE_TAG"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Deploy
        run: |
          IMAGE_TAG=${{ github.sha }}
          cd infra/k8s/overlays/staging
          kubectl apply -k . --record
          kubectl set image deployment/cosmos-web web="$ECR_REGISTRY/cosmos-web:$IMAGE_TAG" -n cosmos
          kubectl rollout status deployment/cosmos-web -n cosmos --timeout=10m
