name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  EKS_CLUSTER: cosmos-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: pnpm/action-setup@v3
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Build & push images
        run: |
          IMAGE_TAG=${{ github.sha }}
          for svc in services/*; do
            name=$(basename "$svc")
            docker build -f infra/docker/node-service.Dockerfile -t "$ECR_REGISTRY/cosmos-$name:$IMAGE_TAG" "$svc"
            docker push "$ECR_REGISTRY/cosmos-$name:$IMAGE_TAG"
          done
          for svc in ai/*; do
            name=$(basename "$svc")
            docker build -f infra/docker/python-service.Dockerfile -t "$ECR_REGISTRY/cosmos-$name:$IMAGE_TAG" "$svc"
            docker push "$ECR_REGISTRY/cosmos-$name:$IMAGE_TAG"
          done

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Deploy
        run: |
          IMAGE_TAG=${{ github.sha }}
          cd infra/k8s/overlays/staging
          kubectl apply -k . --record
          kubectl get deploy -n cosmos -o name | xargs -I {} kubectl set image {} '*=${ECR_REGISTRY}/{}:'$IMAGE_TAG -n cosmos || true
          kubectl rollout status deploy -n cosmos --timeout=10m
